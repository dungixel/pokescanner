<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <title>PokeScanner</title>
  <meta name="description" content="PokeScanner: la Pokédex competitiva en español. Estadísticas, tiers, sets de Smogon, movimientos y comparador. Datos de Pokémon Showdown y Smogon.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PokeScanner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/lexend-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lexend-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('pk.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="boot ldg" role="status"><img class="ldg-ball" src="icons/icon.svg" alt="" width="72" height="72"><p id="boot-t">Cargando PokeScanner…</p></div>
  </main>
  <script>try{var l=localStorage.getItem('pk.lang');if(!/^(es|en|fr|de)$/.test(l)){l='en';for(var x of navigator.languages||[navigator.language]){var c=String(x).slice(0,2).toLowerCase();if(/^(es|en|fr|de)$/.test(c)){l=c;break}}}var m={en:'Loading PokeScanner…',fr:'Chargement de PokeScanner…',de:'PokeScanner wird geladen…'}[l];if(m)document.getElementById('boot-t').textContent=m}catch(e){}</script>
  <nav id="dock" aria-label="PokeScanner"></nav>
  <div id="smodal" class="smodal" hidden></div>
  <dialog id="sheet" aria-label="Detalle"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="boot">Esta web necesita JavaScript para funcionar. / This site needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
