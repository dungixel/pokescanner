<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1016" media="(prefers-color-scheme: dark)">
  <title>PokeScanner</title>
  <meta name="description" content="PokeScanner: la Pokédex competitiva en español. Estadísticas, tiers, sets de Smogon, movimientos y comparador. Datos de Pokémon Showdown y Smogon.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PokeScanner">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/lexend-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lexend-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('pk.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <main id="app" aria-live="polite">
    <p class="boot">Cargando PokeScanner…</p>
  </main>
  <nav id="dock" aria-label="PokeScanner"></nav>
  <div id="smodal" class="smodal" hidden></div>
  <dialog id="sheet" aria-label="Detalle"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="boot">Esta web necesita JavaScript para funcionar. / This site needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
