# Actualiza los datos de PokeScanner cada semana (Showdown, Smogon, PokeAPI y PKHeX) y publica el resultado.
name: Actualizar datos

on:
  schedule:
    - cron: '17 4 * * 1'   # lunes, 04:17 UTC
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar fuentes y regenerar datos
        run: npm run update
      - name: Subir cambios
        run: |
          git config user.name "pokescanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualización semanal de datos"
          git push
      - name: Pedir la publicación de la web
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
